name: Sync BBS Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Sync data from BBS
        run: |
          curl -s "http://194.147.16.88:38917/api/recent?limit=20" -o /tmp/bbs_data.json 2>/dev/null || echo '{"threads":[]}' > /tmp/bbs_data.json
          
          node -e "
          const fs = require('fs');
          let data;
          try {
            data = JSON.parse(fs.readFileSync('/tmp/bbs_data.json', 'utf8'));
          } catch(e) {
            data = { threads: [] };
          }
          
          const threads = (data.threads || []).slice(0, 15).map(t => ({
            title: t.title || '无标题',
            author: t.username || '匿名',
            replies: t.lastReplyAt ? 1 : 0,
            views: t.views || 0,
            date: t.createdAt ? new Date(t.createdAt).toLocaleDateString('zh-CN') : '-'
          }));
          
          const output = {
            stats: {
              threads: data.threads ? data.threads.length : 0,
              replies: 0,
              users: 7,
              online: true,
              updated: new Date().toISOString().slice(0, 16).replace('T', ' ')
            },
            threads: threads
          };
          
          fs.writeFileSync('docs/data.json', JSON.stringify(output, null, 2));
          console.log('Synced', threads.length, 'threads');
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "update: sync BBS data $(date -u +'%Y-%m-%dT%H:%M:%SZ')" --allow-empty
          git push

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
        with:
          path: docs/
