<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>涓夊崄鍏腑BBS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; line-height: 1.6; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
.header { text-align: center; padding: 40px 0; border-bottom: 1px solid #333; }
.header h1 { font-size: 2.5em; color: #e94560; margin-bottom: 10px; }
.header p { color: #aaa; font-size: 1.1em; }
.badge { display: inline-block; background: #e94560; color: #fff; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; margin: 5px; }
.section { background: #16213e; border-radius: 12px; padding: 25px; margin: 20px 0; }
.section h2 { color: #e94560; margin-bottom: 15px; font-size: 1.3em; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
.stat-card { background: #0f3460; border-radius: 10px; padding: 20px; text-align: center; }
.stat-card .num { font-size: 2em; color: #e94560; font-weight: bold; }
.stat-card .label { color: #aaa; font-size: 0.9em; }
.thread { background: #0f3460; border-radius: 10px; padding: 15px; margin: 10px 0; border-left: 3px solid #e94560; }
.thread-title { color: #fff; font-size: 1.1em; margin-bottom: 5px; }
.thread-meta { color: #aaa; font-size: 0.85em; }
.thread-meta span { margin-right: 15px; }
.thread-reply { color: #e94560; }
.footer { text-align: center; padding: 30px 0; color: #666; border-top: 1px solid #333; margin-top: 40px; }
.status { display: inline-block; padding: 3px 10px; border-radius: 15px; font-size: 0.8em; }
.status-online { background: #2ed573; color: #000; }
.status-offline { background: #e94560; color: #fff; }
@media (max-width: 600px) { .header h1 { font-size: 1.8em; } .stats { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>馃彨 涓夊崄鍏腑BBS</h1>
    <p>鍚堣偉甯傜涓夊崄鍏腑瀛?路 鏍″洯璁哄潧</p>
    <p><span class="badge">QQ棰戦亾鍚屾</span><span class="badge">鑷姩璇勮</span><span class="badge">瀹炴椂鍦ㄧ嚎</span></p>
  </div>

  <div class="section">
    <h2>馃搳 璁哄潧缁熻</h2>
    <div class="stats">
      <div class="stat-card"><div class="num" id="threads">-</div><div class="label">甯栧瓙鎬绘暟</div></div>
      <div class="stat-card"><div class="num" id="replies">-</div><div class="label">鍥炲鎬绘暟</div></div>
      <div class="stat-card"><div class="num" id="users">-</div><div class="label">娉ㄥ唽鐢ㄦ埛</div></div>
      <div class="stat-card"><div class="num" id="status">-</div><div class="label">鏈嶅姟鐘舵€?/div></div>
    </div>
  </div>

  <div class="section">
    <h2>馃敟 鐑棬甯栧瓙</h2>
    <div id="threads-list"></div>
  </div>

  <div class="section">
    <h2>馃敆 璁块棶閾炬帴</h2>
    <p><strong>绾夸笂鍦板潃:</strong> <a href="https://38middle.brightmoon.work" style="color:#e94560">https://38middle.brightmoon.work</a></p>
    <p><strong>GitHub:</strong> <a href="https://github.com/longking2012/bbs38" style="color:#e94560">github.com/longking2012/bbs38</a></p>
  </div>

  <div class="footer">
    <p>涓夊崄鍏腑BBS 漏 2026 路 鐢?鑻ユ按鍑″績 缁存姢</p>
    <p>鏁版嵁鏉ユ簮: QQ棰戦亾鑷姩鍚屾 路 鏈€鍚庢洿鏂? <span id="update-time">-</span></p>
  </div>
</div>

<script>
// 浠嶨itHub Pages鏁版嵁鏂囦欢鍔犺浇
async function loadData() {
  try {
    const resp = await fetch('data.json');
    if (!resp.ok) throw new Error('Failed');
    const data = await resp.json();
    
    // 鏇存柊缁熻
    document.getElementById('threads').textContent = data.stats.threads;
    document.getElementById('replies').textContent = data.stats.replies;
    document.getElementById('users').textContent = data.stats.users;
    document.getElementById('update-time').textContent = data.stats.updated;
    
    // 鏈嶅姟鐘舵€?    const statusEl = document.getElementById('status');
    if (data.stats.online) {
      statusEl.innerHTML = '<span class="status status-online">鍦ㄧ嚎</span>';
    } else {
      statusEl.innerHTML = '<span class="status status-offline">绂荤嚎</span>';
    }
    
    // 鐑棬甯栧瓙
    const listEl = document.getElementById('threads-list');
    listEl.innerHTML = data.threads.map(t => `
      <div class="thread">
        <div class="thread-title">${t.title}</div>
        <div class="thread-meta">
          <span>馃懁 ${t.author}</span>
          <span>馃挰 ${t.replies}鍥炲</span>
          <span>馃憗 ${t.views}娴忚</span>
          <span class="thread-reply">${t.date}</span>
        </div>
      </div>
    `).join('');
  } catch (e) {
    console.error('鍔犺浇鏁版嵁澶辫触:', e);
    document.getElementById('threads').textContent = 'N/A';
  }
}

loadData();
// 姣忓垎閽熷埛鏂颁竴娆?setInterval(loadData, 60000);
</script>
</body>
</html>
